<!doctype html>
<!--
  Multiplying Frogs — Title screen — OPTION B: RESUME is primary
  Device: kids' Android tablet, held landscape.
  Canvas: 1920 x 1200, drawn 1:1. Open this on the tablet.

  One of a PAIR. The other is title-screen.html, which is this
  same layout with the primary and secondary styles swapped between the two
  buttons. Nothing else differs. Neither is agreed yet — the pair is how the
  spec page's open question 1 ("which of RESUME and NEW is primary?") gets
  answered, and the winner becomes title-screen.html.

  Drawn in the state where A SAVE EXISTS, so both buttons are live. What the
  screen looks like when there is nothing to resume is open question 2 on
  docs/specs/ui/title-screen.md and is not drawn here.

  Shapes, sizes and positions only. The colours are placeholders so the frogs
  can be told apart in a picture; the palette is an area:art decision.
  Numbers here are the numbers in the spec page's constants table.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Multiplying Frogs — Title screen — Option B: RESUME primary</title>
<style>
  :root{
    --ink:#1E2422; --line:#6C7873; --faint:#B9C0BD; --paper:#FFFFFF;
    --bg:#EDF1EF; --accent:#2E7D4F; --warn:#B03A2E;
    --green:#3F8E4F; --blue:#2C6DAF; --orange:#D2762B; --pink:#C24C86;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#20262A;display:flex;justify-content:center;align-items:flex-start}
  .frame{width:1920px;height:1200px;position:relative;overflow:hidden;
         background:var(--bg);color:var(--ink);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .abs{position:absolute}
  .mid{display:flex;align-items:center;justify-content:center}
  .hatch{background:repeating-linear-gradient(45deg,#DCE3E0 0 14px,#E8EDEB 14px 28px)}

  /* The action row. TitleButtonBottomOffset (120px) up from the bottom safe
     area (SafeMargin, 48px) = 168px from the canvas edge. Centred as a row:
     TitleButtonWidth 560 x2 + TitleButtonGap 48 = 1168, so 376px either side. */
  .action{position:absolute;left:50%;transform:translateX(-50%);bottom:168px;
          display:flex;gap:48px}
  .tbtn{width:560px;height:160px;border-radius:24px;display:flex;align-items:center;
        justify-content:center;font-size:64px;font-weight:800}
  .tbtn.p{background:var(--accent);color:#fff}
  .tbtn.s{border:4px solid var(--line);color:var(--ink)}
</style>
</head>
<body>
<div class="frame">
    <div class="abs hatch" style="inset:0"></div>
    <div class="abs mid" style="inset:0;font-size:34px;color:#8F9C97">SPLASH ART — issue #168 — fills the canvas</div>
    <div class="abs" style="left:0;right:0;top:180px;text-align:center;font-size:160px;font-weight:800;letter-spacing:-2px">Multiplying Frogs</div>
    <div class="action">
      <div class="tbtn p">RESUME</div>
      <div class="tbtn s">NEW</div>
    </div>
    <div class="abs" style="left:48px;bottom:48px;font-size:28px;color:#6C7873">v0.1.0</div>
</div>
</body>
</html>
