# What this repository is, for ai-sdlc.
#
# Everything else about the pipeline — the skills, the workflows, the specs —
# is identical in every repository that adopts it. This file is the only place
# Multiplying Frogs differs from the others.
#
# See https://derekwinters.github.io/ai-sdlc/spec/configuration/ for the schema.

# Every capability is live. They arrived one at a time, each replacing the
# local tooling doing that job, because `adopt` installs everything a declared
# capability owns on its next run — declaring `pipeline` while the old
# gatekeeper still handled `issue_comment` would have meant two handlers on one
# event, racing, both writing.
# `substrate` is implied and is not listed.
capabilities:
  - hygiene
  - labels
  - consistency
  - release
  - pipeline

# Both markers are present — ProjectSettings/ProjectVersion.txt and mkdocs.yml —
# and detection would find both. Stated explicitly anyway: a repository that has
# said what it is does not get second-guessed by a marker file appearing or
# disappearing.
profiles:
  - unity
  - mkdocs

# Who may drive the pipeline with commands. Connor decides plenty about the
# game, but the pipeline's approvals are Derek's.
owners:
  - derekwinters

# The existing dashboard issue, reused rather than replaced. Opening a second
# one would leave two boards disagreeing.
dashboard_issue: 163

# v0.5, v0.6, v0.10 — ordered as versions rather than as strings, so v0.10
# follows v0.9 instead of preceding v0.2. Non-version milestones
# ("Human", "ai-sdlc adoption") are deliberately outside
# the ordering and are never the focus milestone.
milestone_ordering: semver

# Which of this repository's secrets hold the analysis routine's endpoint and
# token. Names, never values — `adopt` reads these to write the gatekeeper
# caller's `secrets:` block, and without them the workflow receives empty
# strings and triage silently never runs (ai-sdlc#118).
#
# These are the same two secrets the pre-adoption gatekeeper used; only the
# way they reach the workflow has changed.
fire:
  endpoint_secret: AI_TRIAGE_URL
  token_secret: AI_TRIAGE_SECRET

# The ai-sdlc skills installed here, kept at the pin by `skills-update.yml`.
# This repository's list, not a central registry's — DIST says the repository
# owns it, because the two previous attempts at a fleet-wide skill sync both
# read a registry and both reverted work a repository had done.
#
# These are the skills something *in this repository* invokes: the analysis
# session reads `triage-issue`, the dev agent reads `pipeline-dev`, and the
# rest are run by hand or by an agent. Deliberately absent are the skills that
# only ever run inside a reusable workflow — `pipeline-gatekeeper`,
# `pipeline-dashboard`, `label-sync`, `closing-keyword`, `docs-gate`. Those
# execute from ai-sdlc's own checkout (`SKILL_ROOT=.ai-sdlc-checkout`), so a
# copy here would be a second version to keep in step for no gain.
#
# `adopt` is absent for a different reason: it imports `lib.config`, which is
# not part of the skill, so an installed copy cannot run — upgrades are run
# from an ai-sdlc checkout instead. `issue-blockers` has the same defect
# (`lib.github`) and is listed anyway: it is genuinely one of ours, and the fix
# belongs upstream. Both are flagged in ai-sdlc#149.
skills:
  - triage-issue
  - pipeline-dev
  - ci-watch
  - milestone-ops
  - issue-blockers
  - release-flow

commands:
  # The Core suite: no editor, no licence, about two seconds.
  test: dotnet test Tests/Core/Frogs.Core.Tests.csproj
  # Core has not gained a Unity dependency — rule 2 in CLAUDE.md, enforced.
  verify: python3 .github/scripts/check_core_isolation.py

# Deliberately absent:
#
# `labels:` — frogs' pipeline-state labels already match the canonical
#   vocabulary exactly (ai-triage-queued, ai-triage-running, ai-triage-stalled,
#   pending-approval, needs-clarification, ready-for-work, in-progress, parked),
#   so there is nothing to map. Checked against .github/labels.core.yml rather
#   than assumed.
#
# `bot:` — the default `github-actions` identity, with the watermark read from
#   `github-actions[bot]`. Revisit under #339, which asks whether `claude[bot]`
#   should drive commands.
#
# `commands.spec_validator` — frogs' docs are prose specs, not AREA-NNN
#   requirement tables, so there is no validator to name.
