name: labels-sync

# A caller. The logic is in ai-sdlc; this exists because a trigger
# cannot be centralised — it must be declared in the repository it
# fires for.
#
# Pinned to a commit rather than a tag: a tag can move, and this runs
# with this repository's token. Upgrade with `adopt apply <version>`,
# which rewrites both the SHA and the comment.

on:
  push:
    branches: [main]
    paths:
      - .github/labels.core.yml
      - .github/labels.repo.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  labels-sync:
    uses: derekwinters/ai-sdlc/.github/workflows/reusable-labels-sync.yml@99b15339e95c2767f4a5007ed6bc3d0b4a1c9754 # v0.4.20
    with:
      ref: 99b15339e95c2767f4a5007ed6bc3d0b4a1c9754
