# ai-sdlc: derekwinters/ai-sdlc@v0.4.14 hash=6c85d9ca69edba53
# Managed by `adopt`. Local edits are preserved but stop this file
# being updated — `adopt verify` will report it.
name: triage

# A caller. The logic is in ai-sdlc; this exists because a trigger
# cannot be centralised — it must be declared in the repository it
# fires for.
#
# Pinned to a commit rather than a tag: a tag can move, and this runs
# with this repository's token. Upgrade with `adopt apply <version>`,
# which rewrites both the SHA and the comment.

on:
  issues:
    types: [labeled]

permissions:
  contents: read

jobs:
  triage:
    if: github.event.label.name == 'ai-triage'
    uses: derekwinters/ai-sdlc/.github/workflows/reusable-triage.yml@c3d4504d46cf9e9ec03ec25c10d1d789b107eab9 # v0.4.14
    with:
      ref: c3d4504d46cf9e9ec03ec25c10d1d789b107eab9
    secrets:
      fire_endpoint: ${{ secrets.AI_TRIAGE_URL }}
      fire_token: ${{ secrets.AI_TRIAGE_SECRET }}
