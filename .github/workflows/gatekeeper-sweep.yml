name: gatekeeper-sweep

# A caller. The logic is in ai-sdlc; this exists because a trigger
# cannot be centralised — it must be declared in the repository it
# fires for.
#
# Pinned to a commit rather than a tag: a tag can move, and this runs
# with this repository's token. Upgrade with `adopt apply <version>`,
# which rewrites both the SHA and the comment.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  gatekeeper-sweep:
    uses: derekwinters/ai-sdlc/.github/workflows/reusable-gatekeeper-sweep.yml@37493f389288fd0a44b5832f067f754554d640a3 # v0.4.19
    with:
      ref: 37493f389288fd0a44b5832f067f754554d640a3
      stale_after: 1800
