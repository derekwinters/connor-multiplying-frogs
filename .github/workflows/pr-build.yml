name: pr-build

# Two debug APKs for every PR — the device profile and the emulator profile —
# so "does it still build" is answered by a build rather than by hope, so
# Connor can try a change on his tablet before it merges, and so anyone without
# the tablet can still open it on a desktop emulator.
#
# Distribution is the workflow artifact and nothing else — no store, no
# distribution service, no link that outlives the PR. Artifacts expiring is
# correct: a stale test build is worse than none.

on:
  pull_request:
    paths:
      - Assets/**
      - ProjectSettings/**
      - Packages/**
      - VERSION
      - .github/workflows/pr-build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Debug APKs
    runs-on: ubuntu-latest

    steps:
      # Unlike ci-tests, a missing licence WARNS and skips here. That job is a
      # correctness gate — a green tick claiming the tests ran when they did not
      # is a lie. This one is a convenience: no APK is an absent convenience,
      # not a false claim, and failing every PR over it would train everyone to
      # ignore a red check.
      #
      # All three secrets, not just the licence: GameCI activates with
      # `unity-editor -serial -username -password`, never with the .ulf itself.
      # See the same gate in ci-tests.yml.
      - name: Check for the Unity licence
        id: licence
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=
          for secret in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!secret}" ]; then
              missing="$missing $secret"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::warning::These secrets are not set —$missing — so no debug APK" \
                 "for this PR. See issue #82. Skipping rather than failing — this" \
                 "build is a convenience, not a correctness gate."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.licence.outputs.present == 'true'
        with:
          # The versionCode is the commit count, so the whole history has to be
          # here. A shallow checkout would silently produce a lower number than
          # the last build, and Android refuses to install that.
          fetch-depth: 0

      - name: Work out the build stamp
        id: stamp
        if: steps.licence.outputs.present == 'true'
        env:
          # github.event.pull_request.head.sha, not github.sha: the latter is
          # the merge commit, which is not a commit anyone can check out later.
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "version_code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_sha=$(git rev-parse --short=7 "$HEAD_SHA")" >> "$GITHUB_OUTPUT"
          echo "version=$(cut -d'#' -f1 VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Cache Unity's Library
        if: steps.licence.outputs.present == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: Library-android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-android-

      # Two profiles, the same pair release-build produces: `device` for the
      # tablet and `emulator` for a desktop emulator. The emulator one is what
      # makes a change openable before it merges by anyone who does not have
      # the tablet in their hands.
      #
      # Each build gets its own buildsPath and its own buildName, and each is
      # uploaded as its own artifact. The two differ only in architecture,
      # which is invisible in a filename sitting next to another filename — so
      # an "emulator" download that is really the ARM64 build is a mistake
      # nothing downstream can catch, and it has been made (#252, #218). The
      # shape here is asserted by
      # .github/scripts/tests/test_pr_build_profiles.py.
      #
      # The version name, versionCode, and .debug suffix are applied by
      # BuildStampPreprocessor from these values — a build pre-processor, so no
      # build can be produced without them. See docs/engineering/versioning.md.
      #
      # They go in `customParameters`, which unity-builder appends to the
      # `unity-editor` command line, and not in `env:`, which stops at the
      # container the editor runs inside (#218).
      - name: Build the device APK
        id: device
        if: steps.licence.outputs.present == 'true'
        uses: game-ci/unity-builder@d829bfc901f2347c8fe18898f06712b66916ef42 # v5.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.0.81f1
          targetPlatform: Android
          androidExportType: androidPackage
          # No keystore inputs, so Unity signs with the Android debug key. That
          # is deliberate: the release keystore is a secret this workflow should
          # not be able to reach from a PR branch.
          buildsPath: build/device
          buildName: multiplying-frogs-${{ steps.stamp.outputs.version }}-${{ steps.stamp.outputs.build_sha }}
          allowDirtyBuild: true
          customParameters: -frogsVersionCode ${{ steps.stamp.outputs.version_code }} -frogsBuildSha ${{ steps.stamp.outputs.build_sha }} -frogsApplicationIdSuffix .debug -frogsAndroidProfile device

      # Uploaded before the emulator build starts, not after it finishes. The
      # device APK is the one that answers "does it still build", and a later
      # step failing must not take a good build down with it — that is what
      # cost v0.2.0 its assets in release-build (#282). Here it is free: the
      # artifact is already stored by the time the second build runs.
      - name: Upload the device APK
        if: steps.licence.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-apk-${{ steps.stamp.outputs.version }}-${{ steps.stamp.outputs.build_sha }}
          path: build/device/Android/*.apk
          if-no-files-found: error
          retention-days: 14

      # x86_64 rather than ARM64, so it installs on a desktop emulator. Same
      # version name, same .debug suffix, same debug signing — the only thing
      # that differs is the profile, and therefore the architecture.
      #
      # No `continue-on-error`: unlike release-build, nothing here is waiting
      # downstream to be rescued, and a PR whose app did not build for one of
      # its two targets is a PR that should say so in red.
      - name: Build the emulator APK
        id: emulator
        if: steps.licence.outputs.present == 'true'
        uses: game-ci/unity-builder@d829bfc901f2347c8fe18898f06712b66916ef42 # v5.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.0.81f1
          targetPlatform: Android
          androidExportType: androidPackage
          buildsPath: build/emulator
          buildName: multiplying-frogs-${{ steps.stamp.outputs.version }}-${{ steps.stamp.outputs.build_sha }}-emulator
          allowDirtyBuild: true
          customParameters: -frogsVersionCode ${{ steps.stamp.outputs.version_code }} -frogsBuildSha ${{ steps.stamp.outputs.build_sha }} -frogsApplicationIdSuffix .debug -frogsAndroidProfile emulator

      - name: Upload the emulator APK
        if: steps.licence.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-apk-${{ steps.stamp.outputs.version }}-${{ steps.stamp.outputs.build_sha }}-emulator
          path: build/emulator/Android/*.apk
          if-no-files-found: error
          retention-days: 14

      # Both APKs by name, because the artifacts list is the one place nobody
      # thinks to open — and, when a build did not finish, that its APK is
      # missing rather than quietly claiming two.
      - name: Summarise
        if: always()
        run: |
          if [ "${{ steps.licence.outputs.present }}" != "true" ]; then
            echo "No debug APK: the UNITY_LICENSE secret is not set (#82)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Debug APKs for \`${{ steps.stamp.outputs.version }}-${{ steps.stamp.outputs.build_sha }}\`" \
               "(versionCode ${{ steps.stamp.outputs.version_code }}). Each installs alongside" \
               "the release build as \`.debug\`." >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"

          # Each line is what that build's step actually did, not what the job
          # set out to do. A summary naming an APK nobody built sends the next
          # person to an empty artifacts list, which reads as a broken download
          # rather than as the failed build it is.
          if [ "${{ steps.device.outcome }}" = "success" ]; then
            echo "- \`multiplying-frogs-${{ steps.stamp.outputs.version }}-${{ steps.stamp.outputs.build_sha }}.apk\`" \
                 "— ARM64, for the tablet." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- No device APK: that build did not finish, which is why this run" \
                 "is red." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ steps.emulator.outcome }}" = "success" ]; then
            echo "- \`multiplying-frogs-${{ steps.stamp.outputs.version }}-${{ steps.stamp.outputs.build_sha }}-emulator.apk\`" \
                 "— x86_64, for a desktop emulator." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- No emulator APK: that build did not finish, which is why this run" \
                 "is red." >> "$GITHUB_STEP_SUMMARY"
          fi
