<!doctype html>
<!--
  Multiplying Frogs — Settings dialog
  Device: kids' Android tablet, held landscape.
  Canvas: 1920 x 1200, drawn 1:1. Open this on the tablet.

  Shapes, sizes and positions only. The colours are placeholders so the frogs
  can be told apart in a picture; the palette is an area:art decision.
  Numbers here are the numbers in the spec page's constants table.

  THE AGREED PICTURE. Issue #322 added the About section and drew it twice —
  once under the title, once in the footprint at the bottom-left where the
  version used to live. Derek picked under the title, so this file is that, and
  the footprint file is deleted: a mockup nobody can build to is a mockup that
  confuses the next reader.

  What the comparison established, kept because it is the reason these numbers
  are what they are:

  - The footprint option was proposed as the block "sharing its row with `Back
    to the game` on the right", and expected to be the cheap one because the
    version already lived down there. It is not drawable that way. `Back to the
    game` renders 531 px wide, so of the 788 px of inner width it leaves 257 px
    on the left, and "Designed by Connor" at `SettingsAboutCreditSize` needs
    about 300. Drawn as proposed, the primary button sat on top of the credit
    line.
  - Given a band of its own instead, the footprint option cost the panel the
    same 210 px of height as this one. So height did not pick between them.
  - What picked between them was what the block reads AS, and one structural
    consequence: here `Back to the game` stays exactly `DialogPadding` up from
    the panel's bottom edge, which is where shared-components.md#dialog puts a
    dialog's button row. The footprint option lifted it 260 px to make room for
    a band underneath.

  The panel grows 760 -> 970 px to hold the block. `ButtonDestructiveGap` is
  untouched at 96 px and the actions column is still positioned from the bottom
  of the panel up, so the gap stays the layout rather than a leftover.

  Two earlier corrections, made by issue #222, are preserved: the action buttons
  sit against a padding box (`.panel` is `box-sizing:border-box` with a 3 px
  border), and `How to play` carries the disabled treatment because the screen
  it opens has no wireframe yet (#324).

  That disabled treatment is redrawn here. It used to be a flat grey fill, which
  shared-components.md#button says is wrong — disabled is the kind's own
  appearance at `ButtonDisabledOpacity` (0.40) — and that page asks for the
  mockups to be brought into line the next time they are touched. This is that
  time.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Multiplying Frogs — Settings dialog</title>
<style>
  :root{
    --ink:#1E2422; --line:#6C7873; --faint:#B9C0BD; --paper:#FFFFFF;
    --bg:#EDF1EF; --accent:#2E7D4F; --warn:#B03A2E;
    --green:#3F8E4F; --blue:#2C6DAF; --orange:#D2762B; --pink:#C24C86;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#20262A;display:flex;justify-content:center;align-items:flex-start}
  .frame{width:1920px;height:1200px;position:relative;overflow:hidden;
         background:var(--bg);color:var(--ink);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .abs{position:absolute}
  .row{display:flex;align-items:center}
  .col{display:flex;flex-direction:column}
  .mid{display:flex;align-items:center;justify-content:center}
  .band{position:absolute;left:0;right:0}
  .note{font-size:26px;color:#7A8783}
  .hatch{background:repeating-linear-gradient(45deg,#DCE3E0 0 14px,#E8EDEB 14px 28px)}
  .panel{background:var(--paper);border:3px solid var(--line);border-radius:32px}
  .btn{height:112px;min-width:320px;padding:0 48px;border-radius:24px;display:flex;align-items:center;
       justify-content:center;font-size:44px;font-weight:700}
  .btn.p{background:var(--accent);color:#fff}
  .btn.s{border:4px solid var(--line);color:var(--ink)}
  .btn.d{border:4px solid var(--warn);color:var(--warn)}
  .btn.off{opacity:.40}
  .chip{width:256px;height:96px;border-radius:20px;border:3px solid var(--faint);display:flex;
        align-items:center;gap:24px;padding:0 20px;font-size:32px;background:#fff;flex:none}
  .chip.act{border:6px solid var(--ink);font-weight:700}
  .chip b{display:block;font-size:32px;font-weight:700;line-height:1.1}
  .chip s{display:block;font-size:24px;color:#6C7873;text-decoration:none;line-height:1.2}
  .sw{width:64px;height:64px;border-radius:50%;flex:none}
  .pad{width:112px;height:112px;border-radius:50%;background:#CFE0D2;border:3px solid #9FB8A5;flex:none;position:relative}
  .log{width:176px;height:120px;border-radius:24px;background:#E0D4C3;border:3px solid #B9A78E;flex:none;
       display:flex;align-items:center;justify-content:center;font-size:22px;color:#8A7A63}
  .frog{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:88px;height:88px;border-radius:50%;
        border:4px solid rgba(0,0,0,.35)}
  .scrim{position:absolute;inset:0;background:rgba(20,26,24,.66)}
  .cell{width:104px;height:104px;border:3px solid var(--line);border-radius:10px;background:#fff;
        display:flex;align-items:center;justify-content:center;font-size:56px}
  .cell.fix{border:none;background:transparent;font-weight:700}
  .carry{width:104px;height:56px;display:flex;align-items:center;justify-content:center}
  .carry i{display:block;width:56px;height:52px;border:3px dashed var(--faint);border-radius:8px}
  .key{width:140px;height:140px;border:3px solid var(--line);border-radius:20px;background:#fff;
       display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:700}
  .dice{width:240px;height:240px;border-radius:40px;background:#fff;border:4px solid var(--line);
        display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:34px}
  .pip{width:40px;height:40px;border-radius:50%;background:var(--ink);align-self:center;justify-self:center}
  .card{width:560px;height:420px;border-radius:24px;background:#fff;border:4px solid var(--line);
        display:flex;align-items:center;justify-content:center}
  .gear{width:96px;height:96px;border-radius:50%;border:4px solid var(--line);display:flex;align-items:center;
        justify-content:center;font-size:44px}

  /* DialogTitleSize 56 px in a 68 px line box — 56 x 1.2 rounded up to a
     whole pixel, so `DialogTitleGap` below it is 40 px in any renderer and
     not 43 px in the one that shipped a tighter default. */
  .dlgtitle{font-size:56px;line-height:68px;font-weight:700}

  /* The About block. 144 px tall, and the arithmetic sums exactly:
     40x1.2 + 12 + 32x1.2 + 12 + 28x1.2  =  48 + 12 + 38.4 + 12 + 33.6  =  144. */
  .about{display:flex;flex-direction:column;gap:12px}
  .about .name{font-size:40px;line-height:1.2;font-weight:700;color:var(--ink)}
  .about .credit{font-size:32px;line-height:1.2;color:var(--ink)}
  .about .ver{font-size:28px;line-height:1.2;color:var(--line)}
</style>
</head>
<body>
<div class="frame">
    <div class="abs" style="inset:0;background:#E2E8E5"></div>
    <div class="scrim"></div>

    <!-- Panel 900 x 970, centred: left (1920-900)/2 = 510, top (1200-970)/2 = 115.
         Padding box is 894 x 964, and every offset below is against that. -->
    <div class="abs panel" style="left:510px;top:115px;width:900px;height:970px">

      <!-- Top-down, because in this option the About block is a header and a
           header is measured from the top:
             Settings     56 -> 124    (DialogTitleSize 56 in a 68 px line box)
             About block 164 -> 308    (DialogTitleGap 40, then 144)
           and then the actions column resumes being measured bottom-up:
             How to play  380 -> 492   (SettingsAboutSectionGap 72 below 308)
             End the game 588 -> 700
             Back to the game 796 -> 908  (DialogPadding 56 up from 964) -->
      <div class="abs dlgtitle" style="left:56px;top:56px">Settings</div>

      <div class="abs about" style="left:56px;top:164px">
        <div class="name">Multiplying Frogs</div>
        <div class="credit">Designed by Connor</div>
        <div class="ver">v0.4.0</div>
      </div>

      <div class="abs btn s off" style="left:56px;top:380px;width:788px">How to play</div>
      <div class="abs btn d" style="left:56px;top:588px;width:788px">End the game</div>

      <div class="abs btn p" style="right:56px;bottom:56px">Back to the game</div>
    </div>
</div>
</body>
</html>
