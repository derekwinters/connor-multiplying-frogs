<!doctype html>
<!--
  Multiplying Frogs - Title screen on the splash art - OPTION I: NEW on the log
  Device: kids' Android tablet, held landscape.
  Canvas: 1920 x 1200, drawn 1:1. Open this on the tablet.

  One of TEN comparison mockups for issue #484, drawn so the open questions on
  docs/specs/ui/title-screen.md can be answered by looking:

    A  no frogs, drawn title, log kept        title-screen-art-a-drawn-title-log.html
    B  no frogs, drawn title, no log          title-screen-art-b-drawn-title-no-log.html
    C  no frogs, plain-text title, no log     title-screen-art-c-text-title-no-log.html
    D  no frogs, drawn title, log, scrim      title-screen-art-d-drawn-title-log-scrim.html
    E  all the frogs, button where it is      title-screen-art-e-all-frogs.html
    F  all the frogs, button moved down       title-screen-art-f-all-frogs-button-low.html
    G  all the frogs, a lily-pad button       title-screen-art-g-lilypad.html
    H  all the frogs, a wooden sign           title-screen-art-h-sign.html
    I  all the frogs, NEW on the log          title-screen-art-i-log.html
    J  all the frogs, a pond-corner button    title-screen-art-j-pond-corner.html

  This one: NEW is lettered on the front of the log itself, under the big frog's feet,
  and the log is the button.

  One of four button ideas drawn after Derek saw E and F: "I don't like the button
  yet. Other ideas." Each is still the single NEW control - RESUME is hidden, as it
  is in every build today - and it still goes to game setup. Only how NEW looks and
  where it sits changes. Every number for it here is a PROPOSAL, not a constant
  (open question 7 on the spec page).

  The art is docs/specs/ui/images/title-screen/full.png: the whole splash picture,
  frogs and all. NEW is lettered in the title's font, Fredoka, loaded from the
  committed copy in images/title-screen/fonts/ (SIL Open Font License, OFL.txt
  beside it) - no network.

  The log spans 475-1578 px across and 873-1156 px down (1103 x 283), the big
  frog's feet reach 1031. Label: 84 px, centred at 960 across, between the feet
  and the log's bottom edge (about 1040-1130). Tap target: the log's box, 1103 x
  283 - whether a tap on the frog sitting on it counts too is part of open
  question 7.

  The version string, bottom-left, is unchanged.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Multiplying Frogs - Title screen on the art - Option I: NEW on the log</title>
<style>
  @font-face{font-family:"Fredoka";font-weight:300 700;
             src:url("../images/title-screen/fonts/Fredoka-Variable.ttf") format("truetype")}
  :root{
    --ink:#1E2422; --line:#6C7873; --accent:#2E7D4F;
    --outline:#060b04;            /* the title's dark outline (art-source/splash/title.py) */
    --cream:#F8FAF6;              /* the title glow's white (art-source/splash/sky.py) */
    --bark:#9C540C; --bark-mid:#843C0C; --bark-dark:#54240C;   /* sampled from the log */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#20262A;display:flex;justify-content:center;align-items:flex-start}
  .frame{width:1920px;height:1200px;position:relative;overflow:hidden;
         background:#5BC8F8;color:var(--ink);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .abs{position:absolute}
  .art{left:0;top:0;width:1920px;height:1200px;display:block}
  /* NEW in the title's lettering: Fredoka Bold, a dark outline drawn outside the
     glyph (paint-order puts the stroke under the fill), cream fill. */
  .lettered{font-family:"Fredoka",system-ui,sans-serif;font-weight:700;color:var(--cream);
            -webkit-text-stroke:14px var(--outline);paint-order:stroke fill;
            letter-spacing:2px;line-height:1;display:flex;align-items:center;justify-content:center}
  .loglabel{left:680px;width:560px;top:1040px;height:96px;font-size:84px}
</style>
</head>
<body>
<div class="frame">
    <img class="abs art" src="../images/title-screen/full.png" alt="MULTIPLYING FROGS">
    <div class="abs lettered loglabel">NEW</div>
    <div class="abs" style="left:48px;bottom:48px;font-size:28px;color:var(--line)">v0.1.0</div>
</div>
</body>
</html>
