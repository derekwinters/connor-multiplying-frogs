<!doctype html>
<!--
  Multiplying Frogs — Answer result — wrong
  Device: kids' Android tablet, held landscape.
  Canvas: 1920 x 1200, drawn 1:1. Open this on the tablet.

  Drawn in the Pond style — docs/specs/ui/style-guide.md. The colours are the
  style guide's named palette, not placeholders. Behind the scrim is plain
  PondWater standing in for the board; the board itself is game-board.html.
  Numbers here are the numbers in the spec page's constants table.

  The chip holds the frog and the name only: since the Pond style it no longer
  spells out the pad move, because the sentence above it already says it.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Multiplying Frogs — Answer result — wrong</title>
<style>
  /* Fredoka, committed beside the title screen's mockup under the SIL OFL, loaded by
     relative path so the file opens with no network. Nunito is not committed yet:
     the sentences fall back to the system sans-serif. style-guide.md PS-5, PS-6. */
  @font-face{font-family:"Fredoka";src:url("../images/title-screen/fonts/Fredoka-Variable.ttf") format("truetype");
             font-weight:300 700}
  :root{
    /* style-guide.md — the palette */
    --ink:#1A2614; --inksoft:#3B4A33; --moss:#56634F; --reed:#6B7A62;
    --paper:#FFFDF4; --white:#FFFFFF;
    --leaf:#2C8C1C; --leaflip:#1B5E10; --leafpressed:#257716;
    --lime:#87BD01; --activefill:#F2FADF; --lilywash:#EEF8DC; --sunrays:#E6F5C2;
    --pond:#9FD8F2; --deeppond:#092E4A; --logend:#D98A2B; --berry:#C8361E;
    --green:#3E933E; --blue:#4273B8; --orange:#D38231; --pink:#D41C78;
    --display:"Fredoka","Nunito",system-ui,sans-serif;
    --body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#20262A;display:flex;justify-content:center;align-items:flex-start}
  .frame{width:1920px;height:1200px;position:relative;overflow:hidden;
         background:var(--pond);color:var(--ink);font-family:var(--body)}
  .abs{position:absolute}
  .row{display:flex;align-items:center}
  .col{display:flex;flex-direction:column}
  .mid{display:flex;align-items:center;justify-content:center}
  /* Pond style — style-guide.md */
  .scrim{position:absolute;inset:0;background:rgba(9,46,74,.60)}          /* DeepPond at DialogScrimOpacity */
  .panel{background:var(--paper);border:6px solid var(--ink);border-radius:44px;   /* OutlinePanel, DialogRadius */
         box-shadow:0 14px 0 rgba(26,38,20,.45);color:var(--ink)}             /* ShadowPanel */
  .dlgtitle{font-family:var(--display);font-weight:600;font-size:56px;line-height:68px}
  .dlgbody{font-family:var(--body);font-weight:600;font-size:40px;line-height:1.4;color:var(--inksoft)}
  .btn{height:112px;min-width:320px;padding:0 48px;border-radius:30px;display:flex;align-items:center;
       justify-content:center;white-space:nowrap;font-family:var(--display);font-size:44px;font-weight:600;
       border:5px solid var(--ink)}                                            /* OutlineButton, ButtonRadius */
  .btn.p{background:var(--leaf);color:var(--white);
         box-shadow:0 10px 0 var(--leaflip),0 10px 0 5px var(--ink)}           /* ButtonLipDepth */
  .btn.s{background:transparent;color:var(--ink);box-shadow:0 6px 0 rgba(26,38,20,.25)}
  .btn.d{background:transparent;color:var(--berry);border-color:var(--berry);box-shadow:0 6px 0 rgba(200,54,30,.25)}
  .btn.off{opacity:.40;box-shadow:none}                                         /* ButtonDisabledOpacity */
  .chip{display:inline-flex;align-items:center;gap:24px;width:auto;height:96px;padding:0 20px;flex:none;
        background:var(--white);border:4px solid var(--ink);border-radius:48px;  /* OutlineChip, fully round */
        font-family:var(--display);font-weight:600;font-size:32px;white-space:nowrap}
  .chip.act{border-width:7px;background:var(--activefill)}                     /* OutlineChipActive, ActiveFill */
  .chip .fr{width:108px;height:80px;flex:none}                                  /* PlayerChipFrogSize */
  .fr{background-size:contain;background-position:center;background-repeat:no-repeat}
  .fr.green{background-image:url("../images/frogs/frog-green.png")}
  .fr.blue{background-image:url("../images/frogs/frog-blue.png")}
  .fr.orange{background-image:url("../images/frogs/frog-orange.png")}
  .fr.pink{background-image:url("../images/frogs/frog-pink.png")}
  .badge{border-radius:50%;border:6px solid var(--ink);display:flex;align-items:center;justify-content:center;
         font-family:var(--display);font-weight:700;color:var(--white);box-shadow:0 8px 0 rgba(26,38,20,.35)}
  .verdict{font-family:var(--display);font-weight:600;font-size:76px;line-height:1.1}
  .conseq{font-family:var(--body);font-weight:600;font-size:48px;line-height:1.35;color:var(--inksoft)}
</style>
</head>
<body>
<div class="frame">
    <div class="scrim"></div>
    <div class="abs panel" style="left:410px;top:290px;width:1100px;height:620px">
      <div class="abs badge" style="left:56px;top:56px;width:180px;height:180px;background:var(--berry);font-size:110px">✗</div>
      <div class="abs verdict" style="left:280px;top:70px">Not this time</div>
      <div class="abs conseq" style="left:280px;top:180px;width:760px">331 × 41 = 13,571.<br>Green hops back one lily pad.</div>
      <div class="abs" style="left:56px;top:340px">
        <div class="chip"><span class="fr green"></span><span>Green</span></div>
      </div>
      <div class="abs btn p" style="right:56px;bottom:56px">Blue's turn</div>
    </div>
</div>
</body>
</html>
