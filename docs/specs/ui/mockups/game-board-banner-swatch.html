<!doctype html>
<!--
  Multiplying Frogs — Game board, turn banner with a swatch
  Device: kids' Android tablet, held landscape.
  Canvas: 1920 x 1200, drawn 1:1. Open this on the tablet.

  THIS FILE EXISTS TO BE COMPARED WITH game-board.html AND FOR NO OTHER REASON.
  Issue #326 removes the player chip from the header, and asks one question on
  the way past: with the chip gone, should the header keep the frog's COLOUR at
  all, or say whose turn it is in words alone?

  This file keeps a swatch. game-board.html drops colour entirely. Every other
  pixel on the two canvases is identical — same pond, same elastic gaps, same
  four frogs on the same surfaces. Open both and say which header is the board's.

  Derek asked for words alone and that is what its twin draws, so this is the
  option to argue FOR if it is going to win. The case for it: the header would
  otherwise be the only place on the board that names the active player without
  showing their colour.

  The case against, which is why its twin is the proposal:

    - The lane chip directly below already carries that colour, in the same
      Active state, on the same screen. The swatch is a third statement of a
      thing said twice already.
    - A bare swatch outside a chip is a new element. The 64 px circle inside a
      player chip is that component's `PlayerSwatchDiameter`; lifting it out
      here means naming `TurnBannerSwatchDiameter` for a lone circle belonging
      to no component.
    - The player chip's accessibility invariant is "a word, always, never colour
      alone". Words alone is the inverse case and the invariant permits it —
      the invariant forbids colour without a word, not a word without colour.

  Whichever loses gets deleted.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Multiplying Frogs — Game board, turn banner with a swatch</title>
<style>
  :root{
    --ink:#1E2422; --line:#6C7873; --faint:#B9C0BD; --paper:#FFFFFF;
    --accent:#2E7D4F; --warn:#B03A2E;
    --green:#3E933E; --blue:#37609A; --orange:#D38231; --pink:#D41C78;
    /* game-board.md's Colours table.
       PondWater is SETTLED at #9FD8F2 — Derek picked it over the paler #B5E3F7,
       and that comparison file is deleted (#301). The pond's other two surfaces
       moved with the decision: the log is now a dark chocolate and the pad a
       lighter leaf green than before, and both had to move together because of
       the separability arithmetic on the spec page. There is no --log-edge any
       more; the log is a flat silhouette. */
    --water:#9FD8F2;
    --pad:#B2E67F; --pad-edge:#6E9E4A;
    --log:#4A2E1A; --log-label:#C6B49C;
    --band:#E2E8E5;

    /* THE TWO NUMBERS THAT MAKE THE POND ELASTIC.

       --canvas is the width of the screen this file is a picture of.
       --lane-gap is LanePositionGap, and it is DERIVED from that width:

           LanePositionGap = (canvas - 1536) / 8,  floored at 48

       1536 px is everything on the row that does not stretch — two safe
       margins, the chip gutter, its gap, and the two logs and seven lily pads
       at their own fixed sizes. 8 is the number of gaps between them. At
       canvas 1920 the formula gives exactly 48, which is why this drawing is
       pixel-identical to the one before the pond became elastic.

       The floor is what stops a narrower-than-16:10 screen from squeezing the
       pads together: below 1920 the board stops spreading and is centred,
       which is what it has always done. */
    --canvas:1920px;
    --lane-gap:48px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#20262A;display:flex;justify-content:center;align-items:flex-start}
  /* PondWater is the whole screen, not a band inside it — the header and the
     controls are drawn on top of the water. */
  .frame{width:var(--canvas);height:1200px;position:relative;overflow:hidden;
         background:var(--water);color:var(--ink);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .abs{position:absolute}
  .row{display:flex;align-items:center}
  .col{display:flex;flex-direction:column}
  .mid{display:flex;align-items:center;justify-content:center}
  .band{position:absolute;left:0;right:0}
  .note{font-size:26px;color:#7A8783}
  .hatch{background:repeating-linear-gradient(45deg,#DCE3E0 0 14px,#E8EDEB 14px 28px)}
  .panel{background:var(--paper);border:3px solid var(--line);border-radius:32px}
  .btn{height:112px;min-width:320px;padding:0 48px;border-radius:24px;display:flex;align-items:center;
       justify-content:center;font-size:44px;font-weight:700}
  .btn.p{background:var(--accent);color:#fff}
  .btn.s{border:4px solid var(--line);color:var(--ink)}
  .btn.d{border:4px solid var(--warn);color:var(--warn)}
  .btn.off{background:#C9D2CE;color:#8C9793}
  .chip{width:256px;height:96px;border-radius:20px;border:3px solid var(--faint);display:flex;
        align-items:center;gap:24px;padding:0 20px;font-size:32px;background:#fff;flex:none}
  .chip.act{border:6px solid var(--ink);font-weight:700}
  .chip b{display:block;font-size:32px;font-weight:700;line-height:1.1}
  .chip s{display:block;font-size:24px;color:#6C7873;text-decoration:none;line-height:1.2}
  .sw{width:64px;height:64px;border-radius:50%;flex:none}
  .pad{width:112px;height:112px;border-radius:50%;background:var(--pad);border:3px solid var(--pad-edge);flex:none;position:relative}
  /* One per pond, not one per lane. Width is LogWidth (176); height is
     SharedLogHeight (896, the whole pond band), set inline. */
  /* No border: LogEdge is gone. On the old tan log the rim was what made a log
     read as floating ON the water; against dark chocolate the log clears the
     water by 8:1 on its own and a darker rim was invisible against the fill.
     The label moved to the TOP of the log and to LogLabelInk, because the old
     brown label was chosen for a tan log and is unreadable on this one. */
  .log{position:absolute;width:176px;border-radius:24px;background:var(--log);
       display:flex;align-items:flex-start;justify-content:center;padding-top:28px;
       font-size:26px;color:var(--log-label);letter-spacing:.04em}
  .frog{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:88px;height:88px;border-radius:50%;
        border:4px solid rgba(0,0,0,.35)}
  .scrim{position:absolute;inset:0;background:rgba(20,26,24,.66)}
  .cell{width:104px;height:104px;border:3px solid var(--line);border-radius:10px;background:#fff;
        display:flex;align-items:center;justify-content:center;font-size:56px}
  .cell.fix{border:none;background:transparent;font-weight:700}
  .carry{width:104px;height:56px;display:flex;align-items:center;justify-content:center}
  .carry i{display:block;width:56px;height:52px;border:3px dashed var(--faint);border-radius:8px}
  .key{width:140px;height:140px;border:3px solid var(--line);border-radius:20px;background:#fff;
       display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:700}
  .dice{width:240px;height:240px;border-radius:40px;background:#fff;border:4px solid var(--line);
        display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:34px}
  .pip{width:40px;height:40px;border-radius:50%;background:var(--ink);align-self:center;justify-self:center}
  .card{width:560px;height:420px;border-radius:24px;background:#fff;border:4px solid var(--line);
        display:flex;align-items:center;justify-content:center}
  .gear{width:96px;height:96px;border-radius:50%;border:4px solid var(--line);display:flex;align-items:center;
        justify-content:center;font-size:44px}
</style>
</head>
<body>
<div class="frame">
    <div class="band" style="top:0;height:128px;background:var(--band);border-bottom:3px solid var(--faint)"></div>
    <!-- TURN BANNER — with a swatch. This is the half of #326's question that
         is NOT what Derek asked for, drawn so the choice can be looked at
         rather than argued: the chip goes either way, and this keeps the frog's
         colour in the header while its twin drops colour entirely.

         Note what it costs. A bare swatch outside a chip is a NEW element on
         this board — the 64 px circle inside a player chip is that component's
         `PlayerSwatchDiameter`, and lifting it out here means naming
         `TurnBannerSwatchDiameter` for a lone circle that belongs to nothing.
         `TurnBannerGap` survives under this option, redefined from "gap between
         the banner's chip and its words" to "gap between its swatch and its
         words", at the same 24 px.

         Its twin needs neither constant. -->
    <div class="abs row" style="left:48px;top:16px;height:96px;gap:24px">
      <span class="sw" style="background:var(--green)"></span>
      <div style="font-size:52px;font-weight:700">Green's turn</div>
    </div>
    <div class="abs gear" style="right:48px;top:16px">⚙</div>

    <!-- THE SHARED START LOG — one for the whole pond, position 0 of all four
         lanes, filling the pond band top to bottom. Orange sits on it, on
         lane 3's centre line (y=668, i.e. 540 down the log). -->
    <div class="log" style="left:352px;top:128px;height:896px">Start<span class="frog"
         style="background:var(--orange);top:540px"></span></div>

    <!-- THE SHARED END LOG — one for the whole pond, position 8 of all four
         lanes and the winning space. Blue is home on it, on lane 2's centre
         line (y=484, i.e. 356 down the log). -->
    <div class="log" style="right:48px;top:128px;height:896px">End<span class="frog"
         style="background:var(--blue);top:356px"></span></div>

    <!-- The lanes. A lane is now its chip and its own seven lily pads; both
         ends of it are drawn once, above. -->
    <div class="abs col" style="left:0;top:208px;gap:0">
      <!-- lane 1 green, on its third lily pad -->
      <div class="row" style="height:184px;gap:0">
        <div style="width:48px"></div><div class="chip act"><span class="sw" style="background:var(--green)"></span><span><b>Green</b><s>3 of 8</s></span></div>
        <div class="row" style="margin-left:calc(224px + var(--lane-gap));gap:var(--lane-gap)">
          <div class="pad"></div><div class="pad"></div>
          <div class="pad"><span class="frog" style="background:var(--green)"></span></div>
          <div class="pad"></div><div class="pad"></div><div class="pad"></div><div class="pad"></div>
        </div>
      </div>
      <!-- lane 2 blue, home on the shared End log -->
      <div class="row" style="height:184px;gap:0">
        <div style="width:48px"></div><div class="chip"><span class="sw" style="background:var(--blue)"></span><span><b>Blue</b><s>Home!</s></span></div>
        <div class="row" style="margin-left:calc(224px + var(--lane-gap));gap:var(--lane-gap)">
          <div class="pad"></div><div class="pad"></div><div class="pad"></div><div class="pad"></div><div class="pad"></div><div class="pad"></div><div class="pad"></div>
        </div>
      </div>
      <!-- lane 3 orange, still on the shared Start log -->
      <div class="row" style="height:184px;gap:0">
        <div style="width:48px"></div><div class="chip"><span class="sw" style="background:var(--orange)"></span><span><b>Orange</b><s>0 of 8</s></span></div>
        <div class="row" style="margin-left:calc(224px + var(--lane-gap));gap:var(--lane-gap)">
          <div class="pad"></div><div class="pad"></div><div class="pad"></div><div class="pad"></div><div class="pad"></div><div class="pad"></div><div class="pad"></div>
        </div>
      </div>
      <!-- lane 4 pink, on its sixth lily pad -->
      <div class="row" style="height:184px;gap:0">
        <div style="width:48px"></div><div class="chip"><span class="sw" style="background:var(--pink)"></span><span><b>Pink</b><s>6 of 8</s></span></div>
        <div class="row" style="margin-left:calc(224px + var(--lane-gap));gap:var(--lane-gap)">
          <div class="pad"></div><div class="pad"></div><div class="pad"></div><div class="pad"></div><div class="pad"></div>
          <div class="pad"><span class="frog" style="background:var(--pink)"></span></div>
          <div class="pad"></div>
        </div>
      </div>
    </div>

    <div class="band" style="bottom:0;height:176px;background:var(--band);border-top:3px solid var(--faint)"></div>
    <div class="abs" style="left:50%;transform:translateX(-50%);bottom:16px;width:480px;height:144px;border-radius:24px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:800">Roll</div>
</div>
</body>
</html>
