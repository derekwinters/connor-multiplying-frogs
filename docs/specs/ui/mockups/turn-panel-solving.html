<!doctype html>
<!--
  Multiplying Frogs — Turn panel — Solving, 331 x 41
  Device: kids' Android tablet, held landscape.
  Canvas: 1920 x 1200, drawn 1:1. Open this on the tablet.

  Phase 3, Solving, settled: the Hard card is turned over at 331 x 41, covering the three
  piles' footprint exactly (Easy and Medium are underneath it, unmoved), the die has gone,
  and the working-out grid and keypad are in, as dealt, with the caret in the first answer box.

  docs/specs/ui/turn-panel.md is the spec; every number here is a number in its constants
  table, or in the pile card's (shared-components.md#pile-card) or the working-out grid's
  (working-out-grid.md). Every position is a canvas pixel. The panel is the full-bleed dialog,
  1824 x 1104 at (48, 48); its content runs from 104 to 1816, which is 1712 px.

  Drawn in the Pond style — docs/specs/ui/style-guide.md. The frog, the lily pads, the water,
  the log bark and Fredoka are committed under ../images/ and loaded by relative path, so the
  file opens with no network. Nunito is not committed yet; the hint falls back to system sans.

  Static HTML and CSS, generated once and committed; there is no script on this page.
-->

  @font-face{font-family:"Fredoka";src:url("../images/title-screen/fonts/Fredoka-Variable.ttf") format("truetype");

  :root{

    --ink:#1A2614; --inksoft:#3B4A33; --moss:#56634F; --reed:#6B7A62;

  .bigdie b{position:absolute;width:46px;height:46px;border-radius:50%;background:var(--ink)}
  /* The lime glow round the matched pile — PileGlowWidth, PileGlowGap, PileGlowRadius */
  .glow{position:absolute;border:10px solid var(--lime);border-radius:36px}
  /* The pile card — shared-components.md#pile-card */
  .card{position:absolute;border:6px solid var(--ink);border-radius:26px;overflow:hidden;isolation:isolate}
  .back{background:url("../images/pile-card/water.png") 0 0/256px repeat,var(--pond);
        box-shadow:0 10px 0 rgba(26,38,20,.35)}
  .front{background:var(--white)}
  .padw{position:absolute;filter:drop-shadow(3px 0 0 #1A2614) drop-shadow(-3px 0 0 #1A2614)
        drop-shadow(0 3px 0 #1A2614) drop-shadow(0 -3px 0 #1A2614) drop-shadow(0 6px 0 rgba(26,38,20,.3))}
  .pad{position:absolute;inset:0;background:center/contain no-repeat}
  .pad.a{background-image:url("../images/pile-card/lily-pad-a.png")}
  .pad.b{background-image:url("../images/pile-card/lily-pad-b.png")}
  .die{position:absolute;background:var(--white);border:4px solid var(--ink)}
  .die b{position:absolute;border-radius:50%;background:var(--ink)}
  .log{position:absolute;display:flex;align-items:center;justify-content:center;border:5px solid var(--ink);
       background:url("../images/pile-card/log-bark.jpg") left center/auto 100% repeat-x,#5A3519;
       box-shadow:0 6px 0 rgba(26,38,20,.3)}
  .log.flat{box-shadow:none}
  .log i{position:absolute;border-style:solid;border-color:var(--ink);border-radius:50%;
         background:radial-gradient(closest-side,#E9A85A 0 30%,var(--logend) 31% 58%,#E9A85A 59% 86%,#C9782A 87%)}
  .carve{position:relative;z-index:1;font-family:var(--display);font-weight:600;letter-spacing:.03em;line-height:1;
         color:var(--logcarve);-webkit-text-stroke-color:var(--ink);paint-order:stroke fill}
  .prob{position:absolute;display:flex;flex-direction:column;align-items:flex-end;font-family:var(--display);
        font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
  .prob .rl{align-self:stretch;background:var(--ink)}
  /* The working-out grid and keypad — working-out-grid.md, unchanged */
  .cell{width:104px;height:104px;border:4px solid var(--ink);border-radius:18px;background:var(--white);
        display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:500;font-size:56px}
  .cell.fix{border:none;background:transparent;font-weight:600}
  .carry{width:104px;height:56px;display:flex;align-items:center;justify-content:center}
  .carry i{display:block;width:56px;height:52px;border:3px dashed var(--carry);border-radius:10px}
  .key{width:140px;height:140px;border:5px solid var(--ink);border-radius:30px;background:var(--white);
       display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:600;
       font-size:56px;box-shadow:0 8px 0 rgba(26,38,20,.30)}
</style>
