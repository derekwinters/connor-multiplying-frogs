<!doctype html>
<!--
  Multiplying Frogs — Game board
  Device: kids' Android tablet, held landscape.
  Canvas: 1920 x 1200, drawn 1:1. Open this on the tablet.

  Shapes, sizes and positions only. The colours are placeholders so the frogs
  can be told apart in a picture; the palette is an area:art decision.
  Numbers here are the numbers in the spec page's constants table.

  ONE Start log and ONE End log for the whole pond, spanning every lane in
  play — not one pair per lane. Count them: there are two logs on this canvas,
  whatever the lane count.

  This drawing takes a position on the spec page's three open questions so
  there is something to react to. None of the three is settled:
    1. The logs span only the four lanes in play (SharedLogHeight =
       LaneCount x LaneHeight = 736 px), not the full 896 px pond.
    2. Each frog sits on its own lane's centre line, so the log is shared and
       the positions plainly are not.
    3. LogRadius (24 px) and TrackOutline (3 px) are unchanged from the old
       176 x 120 log.

  Horizontal arithmetic, unchanged by the sharing:
    48 margin + 256 chip + 48 gap
      + 176 log + 48 + (7 x 112 + 6 x 48) + 48 + 176 log
      + 48 margin = 1920.
  Vertical: pond is 1200 - 128 - 176 = 896; four lanes at 184 = 736, centred,
  so the lane stack and both logs run from y=208 to y=944.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Multiplying Frogs — Game board</title>
<style>
  :root{
    --ink:#1E2422; --line:#6C7873; --faint:#B9C0BD; --paper:#FFFFFF;
    --bg:#EDF1EF; --accent:#2E7D4F; --warn:#B03A2E;
    --green:#3F8E4F; --blue:#2C6DAF; --orange:#D2762B; --pink:#C24C86;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#20262A;display:flex;justify-content:center;align-items:flex-start}
  .frame{width:1920px;height:1200px;position:relative;overflow:hidden;
         background:var(--bg);color:var(--ink);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .abs{position:absolute}
  .row{display:flex;align-items:center}
  .col{display:flex;flex-direction:column}
  .mid{display:flex;align-items:center;justify-content:center}
  .band{position:absolute;left:0;right:0}
  .note{font-size:26px;color:#7A8783}
  .hatch{background:repeating-linear-gradient(45deg,#DCE3E0 0 14px,#E8EDEB 14px 28px)}
  .panel{background:var(--paper);border:3px solid var(--line);border-radius:32px}
  .btn{height:112px;min-width:320px;padding:0 48px;border-radius:24px;display:flex;align-items:center;
       justify-content:center;font-size:44px;font-weight:700}
  .btn.p{background:var(--accent);color:#fff}
  .btn.s{border:4px solid var(--line);color:var(--ink)}
  .btn.d{border:4px solid var(--warn);color:var(--warn)}
  .btn.off{background:#C9D2CE;color:#8C9793}
  .chip{width:256px;height:96px;border-radius:20px;border:3px solid var(--faint);display:flex;
        align-items:center;gap:24px;padding:0 20px;font-size:32px;background:#fff;flex:none}
  .chip.act{border:6px solid var(--ink);font-weight:700}
  .chip b{display:block;font-size:32px;font-weight:700;line-height:1.1}
  .chip s{display:block;font-size:24px;color:#6C7873;text-decoration:none;line-height:1.2}
  .sw{width:64px;height:64px;border-radius:50%;flex:none}
  .pad{width:112px;height:112px;border-radius:50%;background:#CFE0D2;border:3px solid #9FB8A5;flex:none;position:relative}
  /* One per pond, not one per lane. Width is LogWidth (176); height is
     SharedLogHeight (LaneCount x LaneHeight), set inline. */
  .log{position:absolute;width:176px;border-radius:24px;background:#E0D4C3;border:3px solid #B9A78E;
       display:flex;align-items:center;justify-content:center;font-size:22px;color:#8A7A63}
  .frog{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:88px;height:88px;border-radius:50%;
        border:4px solid rgba(0,0,0,.35)}
  .scrim{position:absolute;inset:0;background:rgba(20,26,24,.66)}
  .cell{width:104px;height:104px;border:3px solid var(--line);border-radius:10px;background:#fff;
        display:flex;align-items:center;justify-content:center;font-size:56px}
  .cell.fix{border:none;background:transparent;font-weight:700}
  .carry{width:104px;height:56px;display:flex;align-items:center;justify-content:center}
  .carry i{display:block;width:56px;height:52px;border:3px dashed var(--faint);border-radius:8px}
  .key{width:140px;height:140px;border:3px solid var(--line);border-radius:20px;background:#fff;
       display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:700}
  .dice{width:240px;height:240px;border-radius:40px;background:#fff;border:4px solid var(--line);
        display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:34px}
  .pip{width:40px;height:40px;border-radius:50%;background:var(--ink);align-self:center;justify-self:center}
  .card{width:560px;height:420px;border-radius:24px;background:#fff;border:4px solid var(--line);
        display:flex;align-items:center;justify-content:center}
  .gear{width:96px;height:96px;border-radius:50%;border:4px solid var(--line);display:flex;align-items:center;
        justify-content:center;font-size:44px}
</style>
</head>
<body>
<div class="frame">
    <div class="band" style="top:0;height:128px;background:#E2E8E5;border-bottom:3px solid var(--faint)"></div>
    <div class="abs row" style="left:48px;top:16px;gap:24px">
      <div class="chip act"><span class="sw" style="background:var(--green)"></span><span>Green</span></div>
      <div style="font-size:52px;font-weight:700">Green frog's turn</div>
    </div>
    <div class="abs gear" style="right:48px;top:16px">⚙</div>

    <!-- THE SHARED START LOG — one for the whole pond, position 0 of all four
         lanes. Orange sits on it, on lane 3's centre line (y=668, i.e. 460
         down the log). -->
    <div class="log" style="left:352px;top:208px;height:736px">Start<span class="frog"
         style="background:var(--orange);top:460px"></span></div>

    <!-- THE SHARED END LOG — one for the whole pond, position 8 of all four
         lanes and the winning space. Blue is home on it, on lane 2's centre
         line (y=484, i.e. 276 down the log). -->
    <div class="log" style="left:1696px;top:208px;height:736px">End<span class="frog"
         style="background:var(--blue);top:276px"></span></div>

    <!-- The lanes. A lane is now its chip and its own seven lily pads; both
         ends of it are drawn once, above. -->
    <div class="abs col" style="left:0;top:208px;gap:0">
      <!-- lane 1 green, on its third lily pad -->
      <div class="row" style="height:184px;gap:0">
        <div style="width:48px"></div><div class="chip act"><span class="sw" style="background:var(--green)"></span><span><b>Green</b><s>3 of 8</s></span></div>
        <div class="row" style="margin-left:272px;gap:48px">
          <div class="pad"></div><div class="pad"></div>
          <div class="pad"><span class="frog" style="background:var(--green)"></span></div>
          <div class="pad"></div><div class="pad"></div><div class="pad"></div><div class="pad"></div>
        </div>
      </div>
      <!-- lane 2 blue, home on the shared End log -->
      <div class="row" style="height:184px;gap:0">
        <div style="width:48px"></div><div class="chip"><span class="sw" style="background:var(--blue)"></span><span><b>Blue</b><s>Home!</s></span></div>
        <div class="row" style="margin-left:272px;gap:48px">
          <div class="pad"></div><div class="pad"></div><div class="pad"></div><div class="pad"></div><div class="pad"></div><div class="pad"></div><div class="pad"></div>
        </div>
      </div>
      <!-- lane 3 orange, still on the shared Start log -->
      <div class="row" style="height:184px;gap:0">
        <div style="width:48px"></div><div class="chip"><span class="sw" style="background:var(--orange)"></span><span><b>Orange</b><s>0 of 8</s></span></div>
        <div class="row" style="margin-left:272px;gap:48px">
          <div class="pad"></div><div class="pad"></div><div class="pad"></div><div class="pad"></div><div class="pad"></div><div class="pad"></div><div class="pad"></div>
        </div>
      </div>
      <!-- lane 4 pink, on its sixth lily pad -->
      <div class="row" style="height:184px;gap:0">
        <div style="width:48px"></div><div class="chip"><span class="sw" style="background:var(--pink)"></span><span><b>Pink</b><s>6 of 8</s></span></div>
        <div class="row" style="margin-left:272px;gap:48px">
          <div class="pad"></div><div class="pad"></div><div class="pad"></div><div class="pad"></div><div class="pad"></div>
          <div class="pad"><span class="frog" style="background:var(--pink)"></span></div>
          <div class="pad"></div>
        </div>
      </div>
    </div>

    <div class="band" style="bottom:0;height:176px;background:#E2E8E5;border-top:3px solid var(--faint)"></div>
    <div class="abs" style="left:50%;transform:translateX(-50%);bottom:16px;width:480px;height:144px;border-radius:24px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:800">Roll</div>
</div>
</body>
</html>
