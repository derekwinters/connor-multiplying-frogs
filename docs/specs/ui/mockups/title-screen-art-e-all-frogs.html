<!doctype html>
<!--
  Multiplying Frogs - Title screen on the splash art - OPTION E: all the frogs, button where it is
  Device: kids' Android tablet, held landscape.
  Canvas: 1920 x 1200, drawn 1:1. Open this on the tablet.

  One of TEN comparison mockups for issue #484, drawn so the open questions on
  docs/specs/ui/title-screen.md can be answered by looking:

    A  no frogs, drawn title, log kept        title-screen-art-a-drawn-title-log.html
    B  no frogs, drawn title, no log          title-screen-art-b-drawn-title-no-log.html
    C  no frogs, plain-text title, no log     title-screen-art-c-text-title-no-log.html
    D  no frogs, drawn title, log, scrim      title-screen-art-d-drawn-title-log-scrim.html
    E  all the frogs, button where it is      title-screen-art-e-all-frogs.html
    F  all the frogs, button moved down       title-screen-art-f-all-frogs-button-low.html
    G  all the frogs, a lily-pad button       title-screen-art-g-lilypad.html
    H  all the frogs, a wooden sign           title-screen-art-h-sign.html
    I  all the frogs, NEW on the log          title-screen-art-i-log.html
    J  all the frogs, a pond-corner button    title-screen-art-j-pond-corner.html

  This one: the whole picture, frogs and all, with NEW exactly where the spec puts it -
  TitleButtonBottomOffset 120, so the row runs 872-1032 px down - to show the
  clash: the button covers the big frog's tummy and feet. Its face is clear.

  The art is the whole splash picture - the four frogs, their hop lines, the log
  and the drawn title (the unused splashes on the lily pads are left out, as they
  are everywhere) - rendered from the vector layers by
  art-source/splash/build_splash.py --home-only into
  docs/specs/ui/images/title-screen/full.png, with the faint tail of the title's
  glow faded out. Loaded from that committed file, never the network.

  The big frog on the log spans 706-1213 px across and 465-1031 px down; its eyes
  and mouth are above about 740 px. The log runs 873-1156 px down (1145 at the
  centre). The safe area ends 48 px from the bottom, at 1152.

  Every number is the spec page's constants table.

  Drawn in the state that exists today: no saved game, so RESUME is hidden and
  NEW sits alone, centred. With a save, RESUME (560 x 160) goes to NEW's left with
  TitleButtonGap 48 between, the row still centred: 1168 px wide, so it reaches
  across the whole frog and onto the log either side of it. Not drawn.

  Nothing here is agreed yet.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Multiplying Frogs - Title screen on the art - Option E: all the frogs, button where it is</title>
<style>
  :root{
    --ink:#1E2422; --line:#6C7873; --accent:#2E7D4F;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#20262A;display:flex;justify-content:center;align-items:flex-start}
  .frame{width:1920px;height:1200px;position:relative;overflow:hidden;
         background:#5BC8F8;color:var(--ink);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .abs{position:absolute}
  /* art: full-bleed, the whole canvas (exported at exactly 1920 x 1200). */
  .art{left:0;top:0;width:1920px;height:1200px;display:block}

  /* The action row. TitleButtonBottomOffset (120px) up from the bottom safe
     area (SafeMargin, 48px) = 168px from the canvas edge. Centred as a row;
     with RESUME hidden it holds NEW alone. */
  .action{position:absolute;left:50%;transform:translateX(-50%);bottom:168px;
          display:flex;gap:48px}
  .tbtn{width:560px;height:160px;border-radius:24px;display:flex;align-items:center;
        justify-content:center;font-size:64px;font-weight:800}
  .tbtn.p{background:var(--accent);color:#fff}
</style>
</head>
<body>
<div class="frame">
    <img class="abs art" src="../images/title-screen/full.png" alt="MULTIPLYING FROGS">
    <div class="action">
      <div class="tbtn p">NEW</div>
    </div>
    <div class="abs" style="left:48px;bottom:48px;font-size:28px;color:var(--line)">v0.1.0</div>
</div>
</body>
</html>
