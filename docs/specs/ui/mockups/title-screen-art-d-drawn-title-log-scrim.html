<!doctype html>
<!--
  Multiplying Frogs - Title screen on the frog-less splash art - OPTION D: drawn title, log kept, with the scrim
  Device: kids' Android tablet, held landscape.
  Canvas: 1920 x 1200, drawn 1:1. Open this on the tablet.

  One of FOUR comparison mockups for issue #484, drawn so the open questions on
  docs/specs/ui/title-screen.md can be answered by looking:

    A  drawn title, log kept                  title-screen-art-a-drawn-title-log.html
    B  drawn title, no log                    title-screen-art-b-drawn-title-no-log.html
    C  plain-text title, no log               title-screen-art-c-text-title-no-log.html
    D  drawn title, log kept, with the scrim  title-screen-art-d-drawn-title-log-scrim.html

  This one: option A with TitleScrimOpacity (0.35) drawn, for open question 5. The spec
  gives the scrim an opacity and nothing else - no extent, no colour - so this
  draws the one reading that adds no new number: black at 0.35 over the whole
  scene, between the scene and the drawn title, the button above it. It is a
  picture of the question, not a scrim shape being proposed.

  The art is the real splash picture with the frogs and their hop lines hidden,
  rendered from the vector layers by art-source/splash/build_splash.py --home-only
  into docs/specs/ui/images/title-screen/ (scene.png, scene-no-log.png, title.png).
  It is loaded from those committed files, never the network. The pieces are
  stacked here the way the screen would stack them: scene, scrim, title, button.

  Drawn in the state that exists today: no saved game, so RESUME is hidden (not
  laid out) and NEW sits alone, centred. With a save, RESUME (560 x 160) goes to
  NEW's left with TitleButtonGap 48 between, the row still centred: 1168 px wide,
  376 px clear either side, bottom edge in the same place. It fits on this art the
  same way, so it is not drawn.

  Every number is the spec page's constants table. Nothing here is agreed yet.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Multiplying Frogs - Title screen on the art - Option D: drawn title, log kept, with the scrim</title>
<style>
  :root{
    --ink:#1E2422; --line:#6C7873; --accent:#2E7D4F;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#20262A;display:flex;justify-content:center;align-items:flex-start}
  .frame{width:1920px;height:1200px;position:relative;overflow:hidden;
         background:#5BC8F8;color:var(--ink);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .abs{position:absolute}
  /* art: full-bleed, the whole canvas (exported at exactly 1920 x 1200). */
  .art{left:0;top:0;width:1920px;height:1200px;display:block}

  /* The action row. TitleButtonBottomOffset (120px) up from the bottom safe
     area (SafeMargin, 48px) = 168px from the canvas edge. Centred as a row;
     with RESUME hidden it holds NEW alone. */
  .action{position:absolute;left:50%;transform:translateX(-50%);bottom:168px;
          display:flex;gap:48px}
  .tbtn{width:560px;height:160px;border-radius:24px;display:flex;align-items:center;
        justify-content:center;font-size:64px;font-weight:800}
  .tbtn.p{background:var(--accent);color:#fff}
</style>
</head>
<body>
<div class="frame">
    <img class="abs art" src="../images/title-screen/scene.png" alt="">
    <div class="abs" style="inset:0;background:rgba(0,0,0,0.35)"></div>
    <img class="abs art" src="../images/title-screen/title.png" alt="MULTIPLYING FROGS">
    <div class="action">
      <div class="tbtn p">NEW</div>
    </div>
    <div class="abs" style="left:48px;bottom:48px;font-size:28px;color:var(--line)">v0.1.0</div>
</div>
</body>
</html>
